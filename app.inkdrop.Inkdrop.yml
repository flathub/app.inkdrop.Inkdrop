app-id: app.inkdrop.Inkdrop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: inkdrop
separate-locales: false
tags:
  - proprietary

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # keyring access
  - --talk-name=org.freedesktop.secrets
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: inkdrop
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/applications inkdrop/app.inkdrop.Inkdrop.desktop
      - install -Dm644 -t /app/share/metainfo inkdrop/app.inkdrop.Inkdrop.metainfo.xml
      - install -Dm644 inkdrop/app.inkdrop.Inkdrop.png /app/share/icons/hicolor/256x256/apps/app.inkdrop.Inkdrop.png
      - rm inkdrop/app.inkdrop.Inkdrop.*
      - cp -a inkdrop /app/inkdrop
      - install -Dm755 inkdrop.sh /app/bin/inkdrop
    sources:
      - type: archive
        only-arches:
          - x86_64
        dest: inkdrop
        strip-components: 0
        url: https://dist.inkdrop.app/releases/inkdrop-6.3.1-x64-linux.zip
        sha256: 6cd9aac96e74753bf19256f5a4b722876f8f7fca5373d6121e4405527ff299b7
        x-checker-data:
          type: json
          url: https://api.inkdrop.app/download/latest
          version-query: .version
          url-query: .links.linux[] | select(.arch == "x64" and .type == "zip") |
            .url
          is-main-source: true

      - type: archive
        only-arches:
          - aarch64
        dest: inkdrop
        strip-components: 0
        url: https://dist.inkdrop.app/releases/inkdrop-6.3.1-arm64-linux.zip
        sha256: 1563a15ed8698cf69941f4c2e416a79c26552b8277349ca32ffeb3976d330cf8
        x-checker-data:
          type: json
          url: https://api.inkdrop.app/download/latest
          version-query: .version
          url-query: .links.linux[] | select(.arch == "arm64" and .type == "zip")
            | .url

      - type: file
        path: inkdrop.sh
